name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build mbedtls for iOS arm64
        run: |
          # ⚠️  MUST use 2.x — the vendored headers in thirdparty/include are mbedtls 2.24.0.
          # Linking a 3.x library against 2.x headers causes ABI mismatch and linker failure.
          # 2.28.9 is the last 2.x LTS release and is API-compatible with 2.24.0.
          # 2.x has NO git submodules — do NOT use --recurse-submodules.
          git clone --depth 1 --branch v2.28.9 https://github.com/Mbed-TLS/mbedtls.git mbedtls-src
          cd mbedtls-src
          mkdir build-ios && cd build-ios
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT="$IOS_SDK" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=OFF \
            -DENABLE_PROGRAMS=OFF \
            -DMBEDTLS_FATAL_WARNINGS=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          make -j$(sysctl -n hw.logicalcpu) mbedcrypto mbedtls mbedx509
          mkdir -p ../../mbedtls-ios/lib
          cp library/libmbedcrypto.a library/libmbedtls.a library/libmbedx509.a \
             ../../mbedtls-ios/lib/
          echo "✅ mbedtls 2.28.9 built for iOS arm64"
          echo "   libs: $(ls -lh ../../mbedtls-ios/lib/)"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (unsigned)
        run: |
          # set -o pipefail makes the pipe fail if xcodebuild fails,
          # even when piped through xcpretty.
          set -o pipefail
          xcodebuild \
            -project PKGExtractor.xcodeproj \
            -scheme PKGExtractor \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos" \
            build 2>&1 | xcpretty

          # Verify the executable binary exists — not just the .app directory.
          # The directory is created even on failed builds; the binary is not.
          BINARY="build/Release-iphoneos/PKGExtractor.app/PKGExtractor"
          if [ ! -f "$BINARY" ]; then
            echo "❌ Build failed: executable not found at $BINARY"
            exit 1
          fi
          echo "✅ Binary present: $(ls -lh $BINARY)"

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Release-iphoneos/PKGExtractor.app build/Payload/
          cd build
          zip -r PKGExtractor-unsigned.ipa Payload/
          echo "📦 IPA size: $(du -sh PKGExtractor-unsigned.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PKGExtractor-unsigned
          path: build/PKGExtractor-unsigned.ipa
          retention-days: 30
